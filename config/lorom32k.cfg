# ld65 memory map: LoROM, 32 KiB (one bank), SlowROM.
#
# In LoROM, the upper half of each bank ($8000-$FFFF) maps 32 KiB of ROM.
# The CPU starts in bank $00 and every interrupt vector points into bank $00,
# so for now everything lives there. The internal header is at $00:FFB0 and
# the vectors at $00:FFE0 (file offsets $7FB0 and $7FE0).
#
# Work RAM: the first 8 KiB ($0000-$1FFF) is mirrored into banks $00-$3F, so
# bank-$00 code reaches it with plain 16-bit addresses. Direct page (the
# 65816's "zero page") is $0000-$00FF and the stack grows down from $1FFF.
#
# To grow the ROM: add ROM banks ($018000, $028000, ...) as new MEMORY areas,
# raise the header's ROM size byte, and keep the total a power of two.

MEMORY {
    ZEROPAGE: start = $0000, size = $0100, type = rw;
    LORAM:    start = $0100, size = $1E00, type = rw;  # $0100-$1EFF; stack above
    ROM:      start = $8000, size = $8000, type = ro, file = %O, fill = yes, fillval = $FF;
}

SEGMENTS {
    ZEROPAGE: load = ZEROPAGE, type = zp;
    BSS:      load = LORAM,    type = bss, optional = yes;
    CODE:     load = ROM,      type = ro;
    RODATA:   load = ROM,      type = ro;
    HEADER:   load = ROM,      type = ro, start = $FFB0;
    VECTORS:  load = ROM,      type = ro, start = $FFE0;
}
